version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: thoracicai_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: thoracicpassword123
      POSTGRES_DB: thoracicai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thoracicai"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thoracicai_backend
    environment:
      - DATABASE_URL=postgresql://postgres:thoracicpassword123@db:5432/thoracicai
      - ENVIRONMENT=production
      - SUPABASE_JWT_SECRET=local-development-secret-key-32-chars-long
      - CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173","http://localhost:3000"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - report_storage:/app/storage/reports

  frontend:
    image: node:20-alpine
    container_name: thoracicai_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  pgdata:
  report_storage:
