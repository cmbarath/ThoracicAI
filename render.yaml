# ============================================================
# Render Blueprint Specification for ThoracicAI Platform
# ============================================================

services:
  - type: web
    name: thoracicai-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free # Free tier (can be upgraded to Starter/Standard if increased concurrency is required)
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Set securely in Render Dashboard (Supabase PostgreSQL connection string)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: '["https://thoracic-ai.vercel.app", "https://thoracicai.vercel.app"]'
